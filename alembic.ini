# Alembic config for the vehicle knowledge base (PostgreSQL).
#
# Run migrations by hand against any database:
#   KB_DATABASE_URL=postgresql://user:pass@host:5432/db alembic upgrade head
#   alembic -x url=postgresql://user:pass@host:5432/db upgrade head
#   alembic -x url=... downgrade base
# or through the CLI:  vehicle-scraper kb migrate --database-url ...

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
# The URL is never stored here: it comes from `-x url=...` or KB_DATABASE_URL (see env.py).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
