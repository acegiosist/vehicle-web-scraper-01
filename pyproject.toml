[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-scraper"
version = "1.0.0"
description = "Scrape car listings from many sites into one standardized schema"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pydantic>=2.5",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
catalog = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1"]   # catalog / knowledge base (PostgreSQL)
ai = ["anthropic>=2.10,<3"]                              # catalog AI step (Message Batches API)
dev = ["pytest>=8.0", "sqlalchemy>=2.0"]

[project.scripts]
vehicle-scraper = "vehicle_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
