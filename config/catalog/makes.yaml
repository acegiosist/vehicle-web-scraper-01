# Canonical makes for the catalog (catalog/canonical.py).
#
#   <Canonical name>: {country: <country of origin>, aliases: [other spellings]}
#
# Matching ignores case, accents, spaces and punctuation, so "AUDI", "Audi" and "audi"
# need no alias; list only spellings that differ after that ("Landrover", "VW", "Mini Cooper").
# A make found in listings but missing here is still catalogued, but flagged for AI/human review.
# `class: heavy` marks makes that only build trucks/buses (other makes get their class per listing).

