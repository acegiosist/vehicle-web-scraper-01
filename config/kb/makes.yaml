# Curated list of vehicle makes (manufacturers) for the knowledge base.
#
# A make found in the listings is accepted automatically (verified_by = seed) only if its
# spelling matches a name or alias here, compared spelling-insensitively ("AUDI" = "Audi",
# "Landrover" = "Land Rover"). Anything else goes to human review: it may be a real make
# missing from this list (add it) or not a vehicle make at all (trailers, machinery).
#
# class: default vehicle_class for that make's models when listings don't say otherwise
# (car | motorcycle | heavy). Mixed makes (Honda, Suzuki, BMW) get it from each listing.

